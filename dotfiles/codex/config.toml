model = "gpt-5.6-sol"
model_reasoning_effort = "high"
approval_policy = "on-request"

[features]
collaboration_modes = false

[projects."/home/aron"]
trust_level = "trusted"

[projects."/home/aron/brain"]
trust_level = "trusted"

[projects."/home/aron/coding"]
