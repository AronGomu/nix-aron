<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}} — Video Script</title>
<style>
  :root{
    --bg:#0d0f13;
    --bg-bar:#14171d;
    --line:#252a33;
    --text:#e8eaee;
    --dim:#8b93a3;
    --accent:#f0b429;
    --accent-2:#5aa9e6;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:"Inter","Segoe UI",system-ui,-apple-system,sans-serif;
    font-size:var(--fs,28px);
    line-height:1.62;
    -webkit-font-smoothing:antialiased;
  }

  /* ---- top bar ---- */
  .bar{
    position:sticky;top:0;z-index:20;
    background:rgba(20,23,29,.96);
    backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line);
  }
  .bar-in{
    max-width:1100px;margin:0 auto;
    padding:10px 20px;
    display:flex;align-items:center;gap:14px;flex-wrap:wrap;
    font-size:14px;line-height:1.3;
  }
  .brand{font-weight:700;letter-spacing:.02em;color:var(--accent);white-space:nowrap}
  .brand small{display:block;font-weight:400;color:var(--dim);letter-spacing:0}
  .spacer{flex:1}
  button{
    font:inherit;font-size:13px;
    background:#1d222b;color:var(--text);
    border:1px solid var(--line);border-radius:7px;
    padding:6px 11px;cursor:pointer;
  }
  button:hover{border-color:#3b4351;background:#232936}
  button.on{background:var(--accent);color:#191203;border-color:var(--accent);font-weight:600}
  .grp{display:flex;gap:6px;align-items:center}
  .grp span{color:var(--dim);font-size:12px}
  progress{
    display:block;width:100%;height:3px;border:0;
    background:#1a1e26;appearance:none;
  }
  progress::-webkit-progress-bar{background:#1a1e26}
  progress::-webkit-progress-value{background:var(--accent)}
  progress::-moz-progress-bar{background:var(--accent)}

  /* ---- layout ---- */
  main{max-width:1100px;margin:0 auto;padding:0 24px 70vh}

  .title{
    padding:64px 0 40px;border-bottom:1px solid var(--line);margin-bottom:8px;
  }
  .title h1{
    font-size:1.5em;line-height:1.2;margin:0 0 .35em;
    letter-spacing:-.01em;
  }
  .meta{font-size:.5em;color:var(--dim);line-height:1.7}
  .meta b{color:var(--accent-2);font-weight:600}

  /* ---- table of contents ---- */
  .toc{
    margin:28px 0 0;padding:20px 24px;
    background:#12151b;border:1px solid var(--line);border-radius:12px;
    font-size:.52em;
  }
  .toc h2{margin:0 0 12px;font-size:1em;color:var(--dim);text-transform:uppercase;letter-spacing:.09em;font-weight:600}
  .toc ol{margin:0;padding-left:1.4em;columns:2;column-gap:32px}
  @media(max-width:720px){.toc ol{columns:1}}
  .toc li{margin:.3em 0;break-inside:avoid}
  .toc a{color:var(--text);text-decoration:none}
  .toc a:hover{color:var(--accent);text-decoration:underline}
  .toc .t{color:var(--dim);font-variant-numeric:tabular-nums}

  /* ---- script body ---- */
  section{padding:52px 0 8px;border-top:1px solid var(--line);margin-top:44px}
  section:first-of-type{border-top:0}
  h2{
    font-size:.92em;margin:0 0 4px;
    color:var(--accent);letter-spacing:.01em;line-height:1.25;
  }
  h3{
    font-size:.7em;margin:1.7em 0 .1em;
    color:var(--accent-2);font-weight:600;line-height:1.3;
  }
  .cue{
    font-size:.44em;color:var(--dim);letter-spacing:.08em;
    text-transform:uppercase;margin-bottom:1.4em;font-weight:600;
  }
  p{margin:0 0 1.05em;max-width:26ch;max-width:30em}
  p.beat{color:var(--accent);font-weight:600}

  /* reading aid */
  p:hover{color:#fff}
  ::selection{background:var(--accent);color:#191203}

  .end{
    margin-top:60px;padding:34px 0;border-top:1px solid var(--line);
    color:var(--dim);font-size:.5em;text-align:center;
  }

  @media(max-width:640px){
    body{font-size:22px}
    main{padding:0 16px 70vh}
  }
  @media print{
    .bar{display:none}
    body{background:#fff;color:#000;font-size:12pt}
    h2{color:#000}h3{color:#333}
    section{page-break-inside:auto}
  }
</style>
</head>
<body>

<div class="bar">
  <div class="bar-in">
    <div class="brand">{{BRAND}}<small>{{SUBTITLE}}</small></div>
    <div class="spacer"></div>
    <div class="grp">
      <span>text</span>
      <button id="fsDown" title="Smaller (−)">A−</button>
      <button id="fsUp" title="Bigger (+)">A+</button>
    </div>
    <div class="grp">
      <span>scroll</span>
      <button id="slower" title="Slower (←)">−</button>
      <button id="play" title="Play / pause (space)">▶ Auto-scroll</button>
      <button id="faster" title="Faster (→)">+</button>
      <span id="spd">1.0×</span>
    </div>
    <div class="grp">
      <button id="top" title="Back to top">↑ Top</button>
    </div>
  </div>
  <progress id="prog" value="0" max="100"></progress>
</div>

<main>

  <div class="title">
    <h1>{{HEADLINE}}</h1>
    <div class="meta">
      <b id="words">—</b> words · <b id="mins">—</b> estimated at 150 wpm<br>
      Space = play/pause · ← → = speed · + − = text size
    </div>
  </div>

  <nav class="toc">
    <h2>Sections</h2>
    <ol id="tocList"></ol>
  </nav>

{{SECTIONS}}

  <div class="end">— end of script —</div>

</main>

<script>
(function(){
  var WPM = 150;

  // --- word count + read time, whole doc and per section ---
  function countWords(el){
    var t = el.innerText.replace(/\s+/g,' ').trim();
    return t ? t.split(' ').length : 0;
  }
  function mmss(words){
    var s = Math.round(words / WPM * 60);
    return Math.floor(s/60) + ':' + String(s%60).padStart(2,'0');
  }

  var sections = Array.prototype.slice.call(document.querySelectorAll('section'));
  var total = 0;
  var toc = document.getElementById('tocList');
  sections.forEach(function(sec){
    var w = countWords(sec);
    total += w;
    var h = sec.querySelector('h2').textContent;
    var li = document.createElement('li');
    var a = document.createElement('a');
    a.href = '#' + sec.id;
    a.textContent = h;
    var t = document.createElement('span');
    t.className = 't';
    t.textContent = '  ' + mmss(w);
    li.appendChild(a); li.appendChild(t);
    toc.appendChild(li);
  });
  document.getElementById('words').textContent = total.toLocaleString();
  document.getElementById('mins').textContent = mmss(total);

  // --- reading progress ---
  var prog = document.getElementById('prog');
  function onScroll(){
    var max = document.documentElement.scrollHeight - window.innerHeight;
    prog.value = max > 0 ? (window.scrollY / max) * 100 : 0;
  }
  window.addEventListener('scroll', onScroll, {passive:true});
  window.addEventListener('resize', onScroll);
  onScroll();

  // --- font size ---
  var fs = 28;
  function setFs(v){
    fs = Math.min(60, Math.max(16, v));
    document.body.style.setProperty('--fs', fs + 'px');
    onScroll();
  }
  document.getElementById('fsUp').onclick = function(){ setFs(fs + 2); };
  document.getElementById('fsDown').onclick = function(){ setFs(fs - 2); };

  // --- auto-scroll (teleprompter) ---
  var playing = false, speed = 1, acc = 0, last = 0, raf = null;
  var playBtn = document.getElementById('play');
  var spdLabel = document.getElementById('spd');

  function tick(now){
    if(!playing) return;
    if(!last) last = now;
    var dt = (now - last) / 1000;
    last = now;
    acc += dt * 38 * speed;            // ~38 px/s at 1x
    var px = Math.floor(acc);
    if(px >= 1){
      acc -= px;
      window.scrollBy(0, px);
      var max = document.documentElement.scrollHeight - window.innerHeight;
      if(window.scrollY >= max - 1){ stop(); return; }
    }
    raf = requestAnimationFrame(tick);
  }
  function start(){
    playing = true; last = 0; acc = 0;
    playBtn.classList.add('on');
    playBtn.textContent = '❚❚ Pause';
    raf = requestAnimationFrame(tick);
  }
  function stop(){
    playing = false;
    if(raf) cancelAnimationFrame(raf);
    playBtn.classList.remove('on');
    playBtn.textContent = '▶ Auto-scroll';
  }
  playBtn.onclick = function(){ playing ? stop() : start(); };

  function setSpeed(v){
    speed = Math.min(6, Math.max(0.2, Math.round(v * 10) / 10));
    spdLabel.textContent = speed.toFixed(1) + '×';
  }
  document.getElementById('faster').onclick = function(){ setSpeed(speed + 0.2); };
  document.getElementById('slower').onclick = function(){ setSpeed(speed - 0.2); };
  document.getElementById('top').onclick = function(){ stop(); window.scrollTo({top:0}); };

  // stop auto-scroll as soon as the reader takes over
  ['wheel','touchstart','mousedown'].forEach(function(ev){
    window.addEventListener(ev, function(){ if(playing) stop(); }, {passive:true});
  });

  // --- keyboard ---
  document.addEventListener('keydown', function(e){
    if(e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
    if(e.code === 'Space'){ e.preventDefault(); playing ? stop() : start(); }
    else if(e.key === 'ArrowRight'){ e.preventDefault(); setSpeed(speed + 0.2); }
    else if(e.key === 'ArrowLeft'){ e.preventDefault(); setSpeed(speed - 0.2); }
    else if(e.key === '+' || e.key === '='){ setFs(fs + 2); }
    else if(e.key === '-'){ setFs(fs - 2); }
  });
})();
</script>

</body>
</html>
